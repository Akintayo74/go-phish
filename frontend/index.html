    <!-- Instrument Sans (400/500/600) is the family for the whole APP — the
         console, the learning site, every working screen. Unchanged.

         Instrument Serif italic is loaded for exactly one purpose: the accent
         words in the landing page's headings ("built on *consent*"). It is a
         display cut used at two or three words a section, never for body text,
         and no app screen references it. The original note here said the serif
         directions were rejected; they were — as a BODY family for the product.
         A single italic word in a hero is a different decision. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap"
      rel="stylesheet"
    />
