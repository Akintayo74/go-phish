# Render blueprint for CAT-Sim — https://render.com/docs/blueprint-spec
#
# One web service + one Postgres. The service is deliberately SINGLE-ORIGIN: it
# serves the API *and* the built React app from the same host, because the
# client calls the API with relative paths (`fetch('/api/...')`) and the Express
# app registers no CORS middleware. Splitting the frontend onto a static host
# would break every API call in the browser.
#
# Single origin also collapses the two participant-facing base URLs into one:
# tracked links (/t, /sim) and training links (#/learn, #/enroll) share a host,
# so APP_BASE_URL and SIM_TRAINING_URL need no override at all.
#
# First deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Nothing else to do — the start command migrates, and seeds a fresh database
# once (backend/scripts/bootstrap.js). Free instances have no pre-deploy step and
# no shell, so neither can be a separate manual stage.

databases:
  - name: catsim-db
    databaseName: catsim
    user: catsim
    plan: free
    # NOTE: Render deletes a free Postgres instance 30 days after creation.
    # Move to a paid plan before this is anything but a throwaway test URL.

services:
  - type: web
    name: catsim
    runtime: node
    plan: free
    # NOTE: a free web service spins down after ~15 minutes idle, so the first
    # request after a quiet period (including a participant's tracked-link
    # click) waits out a cold start.
    # --include=dev is REQUIRED, not belt-and-braces. NODE_ENV=production is set
    # below and npm honours it by omitting devDependencies — which is where vite
    # lives, so a plain `npm ci` here builds nothing and the deploy fails on
    # `vite: not found`.
    buildCommand: npm ci --include=dev && npm run build
    # Free instances support no preDeployCommand, so the schema is brought up in
    # the start command instead: migrate always, seed only a database that has
    # never been seeded. Exits non-zero on failure, so an instance whose schema
    # is behind its code never takes traffic. On a paid plan this line can move
    # to `preDeployCommand` unchanged. See backend/scripts/bootstrap.js.
    startCommand: npm run bootstrap && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: catsim-db
          property: connectionString

      # The connection string above is Render's INTERNAL one: it stays on the
      # private network, where Postgres neither offers nor needs TLS. Drop this
      # (or set it to anything else) if you point DATABASE_URL at an external
      # provider — backend/knexfile.js then negotiates TLS instead.
      - key: PGSSLMODE
        value: disable

      # Both default to insecure dev placeholders in backend/src/config/index.js.
      # A known IDENTITY_HASH_SECRET makes stored contact hashes guessable; a
      # known JWT_SECRET lets admin sessions be forged. Generated per service and
      # never shown in the repo. Rotating either is a breaking change: the hash
      # secret invalidates every stored participant hash.
      - key: IDENTITY_HASH_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

      # PUBLIC_BASE_URL is intentionally absent: config falls back to Render's
      # own RENDER_EXTERNAL_URL, so tracked links resolve to the real host
      # without a manual step. Set it explicitly only behind a custom domain.

      # Hermetic by default — the `console` provider records send metadata and
      # DISPATCHES NOTHING over the network. A send still reports success and the
      # admin receipt still shows a count, but no mail ever leaves the service, so
      # a tester who sends to their own address receives nothing. This is
      # deliberate for a throwaway/demo deploy; it is also the single most common
      # "why did no email arrive?" surprise. To actually deliver mail — and walk
      # the real send -> click -> train loop — switch to `smtp`/`brevo`/`mailgun`
      # and supply that provider's variables documented below.
      #
      # DASHBOARD-MANAGED (`sync: false`), NOT a committed `value:` — on purpose.
      # A hard-coded value here is BLUEPRINT-MANAGED: Render reverts any dashboard
      # change back to it on the next blueprint sync (which a redeploy runs), so a
      # committed `value: console` silently reset a dashboard MAIL_PROVIDER=mailgun
      # back to `console` and sent every campaign through the no-op provider. Left
      # unset (the fresh-deploy state), config falls back to `console` in
      # backend/src/config/index.js — so the deploy is STILL hermetic by default —
      # while a value you set in the dashboard now actually persists across deploys.
      - key: MAIL_PROVIDER
        sync: false

      # --- Real email delivery (uncomment + fill in to enable) ------------------
      # Set MAIL_PROVIDER=smtp above, then point these at a transactional relay
      # (SendGrid / Mailgun / Amazon SES / Postmark all expose an SMTP endpoint).
      # The provider fails CLOSED: with MAIL_PROVIDER=smtp but no SMTP_HOST it
      # throws at startup rather than silently not sending. SMTP_PASS is a secret
      # and is NEVER logged (services/mailer.js). See backend/src/config/index.js
      # for the defaults each of these falls back to.
      #
      #   - key: SMTP_HOST          # relay host, e.g. smtp.sendgrid.net
      #     sync: false             # set in the dashboard, not committed
      #   - key: SMTP_PORT          # 587 for STARTTLS (default), or 465 with SMTP_SECURE=true
      #     value: "587"
      #   - key: SMTP_SECURE        # "true" only for an implicit-TLS port (465); otherwise omit
      #     value: "false"
      #   - key: SMTP_USER          # relay username / API-key id (e.g. "apikey" for SendGrid)
      #     sync: false
      #   - key: SMTP_PASS          # relay password / API key — SECRET, never logged
      #     sync: false
      #
      # Deliverability note: MAIL_FROM below defaults to a non-routable `.invalid`
      # address, which real relays reject and receiving servers bounce or junk.
      # For a send that actually lands, set MAIL_FROM to an address on a domain you
      # control and have authenticated (SPF/DKIM) at the relay — while keeping the
      # brand generic/fictional (guardrail: no real-organization impersonation).
      # Also honour your provider's rate limit via SEND_RATE_PER_SECOND (default 10).
      #
      # IF SMTP HANGS ~120s THEN FAILS: this host blocks outbound SMTP ports
      # (25/465/587/2525) — a common PaaS restriction. Every send then sits for
      # nodemailer's full connection timeout and fails, with nothing reaching the
      # provider. Don't fight it with ports; send over HTTPS (443) instead:
      #
      #   MAIL_PROVIDER=brevo  + MAIL_API_KEY  (Brevo transactional email API)
      #
      #   - key: MAIL_API_KEY       # Brevo v3 API key (starts `xkeysib-`) — SECRET
      #     sync: false             # from Brevo -> SMTP & API -> API Keys
      #
      # The `brevo` provider (services/mailer.js) posts to api.brevo.com over 443,
      # which is never blocked, and needs no SMTP_* vars. It also fails CLOSED
      # (no MAIL_API_KEY -> throws at startup) and never logs the key or recipient.
      # MAIL_FROM must still be a verified Brevo sender. A failed send now records
      # a safe reason code in the send receipt + logs (e.g. `brevo:http_401` = bad
      # key) so the cause is visible instead of a silent `failed` count.
      #
      # NOTE ON BREVO + THE LURE BUTTON: Brevo force-wraps every link through its
      # click-tracking domain and offers NO way to disable it (per message, per
      # link, or account-wide). On a new account that wrapper breaks the lure's
      # "Verify my account" button ("link temporarily unavailable"). If you need
      # the clickable lure to work, use `mailgun` below instead — it disables
      # click tracking per message so the real /t/<token> link is sent intact.
      #
      #   MAIL_PROVIDER=mailgun  + MAIL_API_KEY + MAILGUN_DOMAIN
      #
      #   - key: MAIL_API_KEY        # Mailgun API key — SECRET
      #     sync: false
      #   - key: MAILGUN_DOMAIN      # sending domain: a sandbox
      #     sync: false              # (sandboxXXXX.mailgun.org, delivers only to
      #                              # Authorized Recipients) for testing, or a
      #                              # verified domain for a real send
      #   - key: MAILGUN_API_BASE_URL  # only for an EU-region account
      #     value: "https://api.eu.mailgun.net"
      #
      # The `mailgun` provider also posts over HTTPS/443 (SMTP-block-immune),
      # fails CLOSED without MAIL_API_KEY *or* MAILGUN_DOMAIN, records metadata
      # only, and turns off click/open tracking per message so the tracked lure
      # link is never rewritten. MAIL_FROM works from the domain you send from.
      #
      # ESP ANTI-PHISHING AUP (applies to Brevo, Mailgun, SendGrid, SES, all of
      # them): a "verify your account" lure with a login link is exactly what
      # their fraud scanners flag, and an account can be SUSPENDED for it. A
      # Mailgun SANDBOX domain lowers this risk (it only reaches addresses you
      # authorize, so it reads as testing, not a live campaign). For a real study
      # you need a provider that has approved you for authorized phishing
      # simulation, or self-hosted sending infrastructure.
      # -------------------------------------------------------------------------

      # GUARDRAIL: generic and fictional. Neither may ever name a real
      # organization (IMPLEMENTATION_PLAN.md §1, checklist §2).
      - key: SIM_BRAND_NAME
        value: Meridian Trust Bank — Staff Portal
      # DASHBOARD-MANAGED (`sync: false`) for the same reason as MAIL_PROVIDER: a
      # committed value here reverts your real sender back to the non-routable
      # `.invalid` placeholder on every blueprint sync, which real relays reject.
      # Left unset, config falls back to that same safe placeholder — so the
      # default stays inert — while the sender you set in the dashboard persists.
      # Set your verified Brevo sender, or (for Mailgun) an address on your sending
      # domain, e.g. `IT Service Desk <no-reply@sandboxXXXX.mailgun.org>`. The from
      # DOMAIN must match MAILGUN_DOMAIN. GUARDRAIL: whatever you set must stay
      # generic and fictional — never name a real organization.
      - key: MAIL_FROM
        sync: false

      # Password for the demo operators. Pre-launch checklist §6 — bootstrap
      # refuses to seed in production without it rather than installing the dev
      # password that is published in this repository. Read it from the Render
      # dashboard (Environment tab) to log in the first time, then create your
      # own operator and remove the demo accounts.
      - key: SEED_ADMIN_PASSWORD
        generateValue: true

      # 'auto' seeds only a database that has never been seeded, which is what
      # makes restarts safe: the seeds are DESTRUCTIVE (they clear cohorts,
      # participants and interactions before inserting) and a free instance
      # restarts every time it wakes from idle. 'never' skips seeding; 'force'
      # reseeds unconditionally and DISCARDS collected data.
      - key: SEED_ON_BOOT
        value: auto
